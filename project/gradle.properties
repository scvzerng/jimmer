group=org.babyfish.jimmer
version=0.11.7.1

# KSP2 (used by jimmer-sql-test-model-kotlin) runs in the Gradle daemon, so the
# KSP worker heap is bounded by org.gradle.jvmargs. Default 512m is too small
# once STRUCTURAL polymorphism + association + many-to-many test models are
# added; bump to 4g so kspKotlin completes without OutOfMemoryError.
org.gradle.jvmargs=-Xmx4g -Xms1g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
